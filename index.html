<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison - Luxury Boutique</title>
  <style>
    /* ==========================================================================
       COLOR PALETTE & VARIABLES (From Image)
       ========================================================================== */
    :root {
      --color-sugar: #FCF8F0;
      --color-bisque: #E2D9CD;
      --color-wheat: #B6A593;
      --color-pistachio: #B5BDAC;
      --color-mocha: #6B584D;
      --color-espresso: #392E26;
      
      --font-family: 'Playfair Display', Georgia, serif;
      --font-body: 'Helvetica Neue', Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-sugar);
      color: var(--color-espresso);
      font-family: var(--font-body);
      line-height: 1.6;
    }

    h1, h2, h3, .brand-logo {
      font-family: var(--font-family);
      font-weight: 400;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       HEADER & NAVIGATION
       ========================================================================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background-color: var(--color-sugar);
      border-bottom: 1px solid var(--color-bisque);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .menu-toggle {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 5px;
    }

    .menu-toggle span {
      display: block;
      width: 25px;
      height: 2px;
      background-color: var(--color-espresso);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .brand-logo {
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--color-espresso);
    }

    .cart-trigger {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--color-espresso);
      position: relative;
    }

    .cart-count {
      background-color: var(--color-mocha);
      color: var(--color-sugar);
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 0.75rem;
      margin-left: 5px;
    }

    /* Side Nav Drawer */
    .nav-drawer {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background-color: var(--color-bisque);
      z-index: 200;
      transition: left 0.3s ease;
      padding: 3rem 2rem;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    }

    .nav-drawer.open {
      left: 0;
    }

    .nav-drawer .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: var(--color-espresso);
    }

    .nav-links {
      list-style: none;
      margin-top: 2rem;
    }

    .nav-links li {
      margin-bottom: 1.5rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--color-espresso);
      font-family: var(--font-family);
      font-size: 1.25rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--color-mocha);
    }

    /* ==========================================================================
       HERO & PRODUCTS
       ========================================================================== */
    .hero {
      text-align: center;
      padding: 4rem 1rem 2rem 1rem;
      background-color: var(--color-sugar);
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: var(--color-espresso);
    }

    .hero p {
      color: var(--color-wheat);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      padding: 3rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      background-color: #FFFFFF;
      border: 1px solid var(--color-bisque);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(57, 46, 38, 0.05);
    }

    .product-image {
      height: 300px;
      background-color: var(--color-bisque);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Shape Accent reflecting image styles */
    .product-image-accent {
      width: 180px;
      height: 220px;
      border-radius: 90px 90px 0 0;
      background-color: var(--color-pistachio);
    }

    .product-card:nth-child(2) .product-image-accent {
      background-color: var(--color-wheat);
      border-radius: 0 90px 90px 0;
    }

    .product-card:nth-child(3) .product-image-accent {
      background-color: var(--color-mocha);
      border-radius: 90px 0 0 90px;
    }

    .product-details {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--color-espresso);
    }

    .product-price {
      color: var(--color-mocha);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .add-to-cart-btn {
      margin-top: auto;
      padding: 0.8rem 1rem;
      background-color: var(--color-espresso);
      color: var(--color-sugar);
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.2s ease;
    }

    .add-to-cart-btn:hover {
      background-color: var(--color-mocha);
    }

    /* ==========================================================================
       CART DRAWER
       ========================================================================== */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background-color: var(--color-sugar);
      z-index: 200;
      transition: right 0.3s ease;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--color-bisque);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-body {
      padding: 1.5rem;
      flex-grow: 1;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--color-bisque);
    }

    .cart-item-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .cart-item-price {
      color: var(--color-mocha);
      font-size: 0.85rem;
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--color-mocha);
      cursor: pointer;
      font-size: 0.8rem;
      text-decoration: underline;
    }

    .cart-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--color-bisque);
      background-color: var(--color-sugar);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .checkout-btn {
      width: 100%;
      padding: 1rem;
      background-color: var(--color-mocha);
      color: var(--color-sugar);
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .checkout-btn:hover {
      background-color: var(--color-espresso);
    }

    /* ==========================================================================
       CHECKOUT MODAL
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(57, 46, 38, 0.5);
      z-index: 300;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .checkout-modal {
      background-color: var(--color-sugar);
      padding: 2.5rem;
      border-radius: 4px;
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    .checkout-modal h2 {
      margin-bottom: 1.5rem;
      color: var(--color-espresso);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
      color: var(--color-espresso);
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--color-wheat);
      background-color: #FFFFFF;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--color-mocha);
    }

    .pay-btn {
      width: 100%;
      padding: 1rem;
      background-color: var(--color-espresso);
      color: var(--color-sugar);
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 1rem;
    }

    .overlay-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.3);
      z-index: 150;
      display: none;
    }

    .overlay-backdrop.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="overlay-backdrop" id="backdrop"></div>

  <nav class="nav-drawer" id="navDrawer">
    <button class="close-btn" id="closeNav">&times;</button>
    <ul class="nav-links">
      <li><a href="#">New Arrivals</a></li>
      <li><a href="#">Collections</a></li>
      <li><a href="#">Bespoke</a></li>
      <li><a href="#">About Us</a></li>
    </ul>
  </nav>

  <header>
    <button class="menu-toggle" id="openNav" aria-label="Toggle Navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <div class="brand-logo">AURA</div>

    <button class="cart-trigger" id="openCart">
      Cart <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <section class="hero">
    <h1>Timeless Earthy Collection</h1>
    <p>Luxury defined by nature</p>
  </section>

  <main class="product-grid">
    <div class="product-card">
      <div class="product-image">
        <div class="product-image-accent"></div>
      </div>
      <div class="product-details">
        <h3 class="product-title">Pistachio Earth Vessel</h3>
        <div class="product-price">$240.00</div>
        <button class="add-to-cart-btn" onclick="addToCart('Pistachio Earth Vessel', 240)">Add to Cart</button>
      </div>
    </div>

    <div class="product-card">
      <div class="product-image">
        <div class="product-image-accent"></div>
      </div>
      <div class="product-details">
        <h3 class="product-title">Wheat Grain Sculpture</h3>
        <div class="product-price">$380.00</div>
        <button class="add-to-cart-btn" onclick="addToCart('Wheat Grain Sculpture', 380)">Add to Cart</button>
      </div>
    </div>

    <div class="product-card">
      <div class="product-image">
        <div class="product-image-accent"></div>
      </div>
      <div class="product-details">
        <h3 class="product-title">Mocha Espresso Lounge Chair</h3>
        <div class="product-price">$1,250.00</div>
        <button class="add-to-cart-btn" onclick="addToCart('Mocha Espresso Lounge Chair', 1250)">Add to Cart</button>
      </div>
    </div>
  </main>

  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Selection</h3>
      <button class="close-btn" id="closeCart" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <div class="cart-body" id="cartItems">
      <p style="color: var(--color-wheat);">Your bag is currently empty.</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button class="checkout-btn" id="openCheckout">Proceed to Checkout</button>
    </div>
  </aside>

  <div class="modal-overlay" id="checkoutModal">
    <div class="checkout-modal">
      <button class="close-btn" id="closeCheckout" style="position:absolute; top:1.5rem; right:1.5rem; background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
      <h2>Checkout</h2>
      <form id="checkoutForm" onsubmit="handlePayment(event)">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="jane@example.com">
        </div>
        <div class="form-group">
          <label for="card">Card Details</label>
          <input type="text" id="card" required placeholder="4532 •••• •••• 8892">
        </div>
        <button type="submit" class="pay-btn">Complete Purchase</button>
      </form>
    </div>
  </div>

  <script>
    // State management
    let cart = [];

    // UI Elements
    const navDrawer = document.getElementById('navDrawer');
    const cartDrawer = document.getElementById('cartDrawer');
    const backdrop = document.getElementById('backdrop');
    const checkoutModal = document.getElementById('checkoutModal');
    
    const openNavBtn = document.getElementById('openNav');
    const closeNavBtn = document.getElementById('closeNav');
    const openCartBtn = document.getElementById('openCart');
    const closeCartBtn = document.getElementById('closeCart');
    const openCheckoutBtn = document.getElementById('openCheckout');
    const closeCheckoutBtn = document.getElementById('closeCheckout');

    // Navigation Toggle
    openNavBtn.addEventListener('click', () => {
      navDrawer.classList.add('open');
      backdrop.classList.add('active');
    });

    closeNavBtn.addEventListener('click', closeAllDrawers);

    // Cart Toggle
    openCartBtn.addEventListener('click', () => {
      cartDrawer.classList.add('open');
      backdrop.classList.add('active');
    });

    closeCartBtn.addEventListener('click', closeAllDrawers);
    backdrop.addEventListener('click', closeAllDrawers);

    function closeAllDrawers() {
      navDrawer.classList.remove('open');
      cartDrawer.classList.remove('open');
      backdrop.classList.remove('active');
    }

    // Add to Cart
    function addToCart(name, price) {
      cart.push({ name, price, id: Date.now() });
      updateCartUI();
      cartDrawer.classList.add('open');
      backdrop.classList.add('active');
    }

    // Remove from Cart
    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      updateCartUI();
    }

    // Update Cart UI
    function updateCartUI() {
      const cartCount = document.getElementById('cartCount');
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');

      cartCount.textContent = cart.length;

      if (cart.length === 0) {
        cartItems.innerHTML = '<p style="color: var(--color-wheat);">Your bag is currently empty.</p>';
        cartTotal.textContent = '$0.00';
        return;
      }

      let itemsHTML = '';
      let total = 0;

      cart.forEach(item => {
        total += item.price;
        itemsHTML += `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-price">$${item.price.toFixed(2)}</div>
            </div>
            <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
          </div>
        `;
      });

      cartItems.innerHTML = itemsHTML;
      cartTotal.textContent = `$${total.toFixed(2)}`;
    }

    // Checkout Window Functionality
    openCheckoutBtn.addEventListener('click', () => {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      closeAllDrawers();
      checkoutModal.classList.add('active');
    });

    closeCheckoutBtn.addEventListener('click', () => {
      checkoutModal.classList.remove('active');
    });

    function handlePayment(event) {
      event.preventDefault();
      alert('Thank you for your order! Your purchase is complete.');
      cart = [];
      updateCartUI();
      checkoutModal.classList.remove('active');
      document.getElementById('checkoutForm').reset();
    }
  </script>
</body>
</html>
